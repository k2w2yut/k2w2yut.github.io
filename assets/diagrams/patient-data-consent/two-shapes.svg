 18));"/><text x="1062" y="340.5">request</text></g></g></g><g data-cell-id="c21"><g><rect x="660" y="480" width="530" height="80" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#B5462E" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(181, 70, 46), rgb(235, 139, 118));"><text x="925" y="517.5">No extra copy; current at each site.</text><text x="925" y="535.5">Each read is slower and needs every site online.</text></g></g></g></g></g></g></svg>