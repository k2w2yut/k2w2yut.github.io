<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" style="background: transparent; background-color: transparent; color-scheme: light dark;" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1001px" height="621px" viewBox="0 0 1001 621"><defs/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="bg"><g><rect x="0" y="0" width="1000" height="620" fill="#ffffff" stroke="none" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));"/></g></g><g data-cell-id="c1"><g><rect x="0" y="15" width="1000" height="40" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#111111" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="24px" style="fill: light-dark(rgb(17, 17, 17), rgb(223, 223, 223));"><text x="500" y="46">The memory hierarchy</text></g></g></g><g data-cell-id="c2"><g transform="translate(0.5,0.5)"><rect x="370" y="80" width="260" height="80" fill="#1f3a5f" stroke="#1f3a5f" pointer-events="all" style="fill: light-dark(rgb(31, 58, 95), rgb(169, 192, 224)); stroke: light-dark(rgb(31, 58, 95), rgb(169, 192, 224));"/></g><g><g fill="#FFFFFF" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="17px" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));"><text x="500" y="127.5">Registers</text></g></g></g><g data-cell-id="c3"><g transform="translate(0.5,0.5)"><rect x="322.5" y="172" width="355" height="80" fill="#2e5a88" stroke="#1f3a5f" pointer-events="all" style="fill: light-dark(rgb(46, 90, 136), rgb(132, 170, 210)); stroke: light-dark(rgb(31, 58, 95), rgb(169, 192, 224));"/></g><g><g fill="#FFFFFF" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="17px" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));"><text x="500" y="219.5">L1 / L2 / L3 cache (SRAM)</text></g></g></g><g data-cell-id="c4"><g transform="translate(0.5,0.5)"><rect x="275" y="264" width="450" height="80" fill="#4f7cac" stroke="#1f3a5f" pointer-events="all" style="fill: light-dark(rgb(79, 124, 172), rgb(103, 141, 183)); stroke: light-dark(rgb(31, 58, 95), rgb(169, 192, 224));"/></g><g><g fill="#FFFFFF" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="17px" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));"><text x="500" y="311.5">Main memory (DRAM)</text></g></g></g><g data-cell-id="c5"><g transform="translate(0.5,0.5)"><rect x="227.5" y="356" width="545" height="80" fill="#9db8d6" stroke="#1f3a5f" pointer-events="all" style="fill: light-dark(rgb(157, 184, 214), rgb(62, 85, 111)); stroke: light-dark(rgb(31, 58, 95), rgb(169, 192, 224));"/></g><g><g fill="#111111" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="17px" style="fill: light-dark(rgb(17, 17, 17), rgb(223, 223, 223));"><text x="500" y="403.5">Flash / SSD</text></g></g></g><g data-cell-id="c6"><g transform="translate(0.5,0.5)"><rect x="180" y="448" width="640" height="80" fill="#d6e2ef" stroke="#1f3a5f" pointer-events="all" style="fill: light-dark(rgb(214, 226, 239), rgb(36, 46, 57)); stroke: light-dark(rgb(31, 58, 95), rgb(169, 192, 224));"/></g><g><g fill="#111111" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="17px" style="fill: light-dark(rgb(17, 17, 17), rgb(223, 223, 223));"><text x="500" y="495.5">Disk and object storage</text></g></g></g><g data-cell-id="c7"><g transform="translate(0.5,0.5)"><path d="M 158 528 L 158 92.35" fill="none" stroke="#b5462e" stroke-width="3" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(181, 70, 46), rgb(235, 139, 118));"/><path d="M 158 83.35 L 162.5 92.35 L 153.5 92.35 Z" fill="#b5462e" stroke="#b5462e" stroke-width="3" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(181, 70, 46), rgb(235, 139, 118)); stroke: light-dark(rgb(181, 70, 46), rgb(235, 139, 118));"/></g></g><g data-cell-id="c8"><g><rect x="10" y="78" width="135" height="150" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#B5462E" font-family="Helvetica" text-anchor="end" font-size="13px" style="fill: light-dark(rgb(181, 70, 46), rgb(235, 139, 118));"><text x="143" y="118.5">faster per access,</text><text x="143" y="134.5">more bandwidth,</text><text x="143" y="150.5">less energy</text><text x="143" y="166.5">per access,</text><text x="143" y="182.5">more cost</text><text x="143" y="198.5">per byte</text></g></g></g><g data-cell-id="c9"><g transform="translate(0.5,0.5)"><path d="M 842 80 L 842 515.65" fill="none" stroke="#2e7d4f" stroke-width="3" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(46, 125, 79), rgb(97, 165, 126));"/><path d="M 842 524.65 L 837.5 515.65 L 846.5 515.65 Z" fill="#2e7d4f" stroke="#2e7d4f" stroke-width="3" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(46, 125, 79), rgb(97, 165, 126)); stroke: light-dark(rgb(46, 125, 79), rgb(97, 165, 126));"/></g></g><g data-cell-id="c10"><g><rect x="855" y="378" width="135" height="150" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#2E7D4F" font-family="Helvetica" text-anchor="start" font-size="13px" style="fill: light-dark(rgb(46, 125, 79), rgb(97, 165, 126));"><text x="857" y="426.5">more capacity,</text><text x="857" y="442.5">less cost</text><text x="857" y="458.5">per byte,</text><text x="857" y="474.5">longer</text><text x="857" y="490.5">latency</text></g></g></g><g data-cell-id="c11"><g><rect x="0" y="540" width="1000" height="40" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#444444" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: light-dark(rgb(68, 68, 68), rgb(179, 179, 179));"><text x="500" y="566">Each level hides the latency of the level below it, for the data that is used again.</text></g></g></g></g></g></g></svg>