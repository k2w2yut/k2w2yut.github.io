><rect x="0" y="569" width="1200" height="60" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#444444" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(68, 68, 68), rgb(179, 179, 179));"><text x="600" y="596.5">Top row: fast, small, costly per unit. Bottom row: large, cheap per unit, slow.</text><text x="600" y="614.5">Each design question is what to keep near the top.</text></g></g></g></g></g></g></svg>